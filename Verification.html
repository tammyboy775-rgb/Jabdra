<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Frontend-only Gmail sign in and account registration form">
    <title>Verify account | Frontend Auth</title>
    <style>
        :root {
            --accent: #635bff;
            --accent-dark: #5148df;
            --ink: #172033;
            --muted: #697386;
            --line: #dfe3ec;
            --surface: #ffffff;
            --page: #f5f7fb;
            --danger: #b42318;
            --danger-bg: #fff1f0;
            --success: #067647;
            --success-bg: #161817;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: grid;
            place-items: center;
            color: var(--ink);
            background: radial-gradient(circle at top left, #e8e7ff, var(--page) 42%);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .card {
            width: min(100%, 470px);
            padding: 34px;
            background: var(--surface);
            border: 1px solid rgba(223, 227, 236, .8);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(30, 35, 90, .12);
        }

        .brand {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            margin-bottom: 18px;
            border-radius: 13px;
            color: #fff;
            background: var(--accent);
            font-size: 22px;
            font-weight: 800;
        }

        h1 { margin: 0 0 8px; font-size: 1.65rem; }
        .intro { margin: 0 0 25px; color: var(--muted); line-height: 1.5; }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            margin-bottom: 24px;
            border-radius: 11px;
            background: #f1f3f8;
        }

        .tab {
            padding: 10px;
            border: 0;
            border-radius: 8px;
            color: var(--muted);
            background: transparent;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .tab.active { color: var(--ink); background: #fff; box-shadow: 0 2px 8px rgba(30, 35, 90, .08); }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 7px; font-size: .9rem; font-weight: 700; }
        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--ink);
            background: #fff;
            font: inherit;
        }
        input:focus { outline: 3px solid rgba(99, 91, 255, .15); border-color: var(--accent); }
        input[aria-invalid="true"] { border-color: var(--danger); }
        .hint { margin: 6px 0 0; color: var(--muted); font-size: .78rem; }
        .error-msg { min-height: 18px; margin: 5px 0 0; color: var(--danger); font-size: .78rem; }
        button[type="submit"] {
            width: 100%;
            margin-top: 7px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: var(--accent);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
        button[type="submit"]:hover { background: var(--accent-dark); }
        .notification { display: none; padding: 12px 14px; margin-bottom: 18px; border-radius: 10px; font-size: .9rem; line-height: 1.4; }
        .notification.success { display: block; color: var(--success); background: var(--success-bg); }
        .notification.error { display: block; color: var(--danger); background: var(--danger-bg); }
        .hidden { display: none; }
        .privacy-note { margin: 20px 0 0; color: var(--muted); font-size: .75rem; line-height: 1.45; text-align: center; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand" aria-hidden="true">@</div>
        <h1>Welcome back</h1>
        <p class="intro">Sign in with Gmail or create a new account in seconds.</p>

        <div class="tabs" role="tablist" aria-label="Account actions">
            <button class="tab active" id="tab-signin" type="button" role="tab" aria-selected="true">Sign in</button>
            <button class="tab" id="tab-signup" type="button" role="tab" aria-selected="false">Create account</button>
        </div>

        <div id="global-notification" class="notification" role="status" aria-live="polite"></div>

        <form id="signin-form" novalidate>
            <div class="form-group">
                <label for="signin-email">Gmail address</label>
                <input id="signin-email" name="email" type="email" autocomplete="username" placeholder="admin@gmail.com" required>
                <p class="error-msg" id="signin-email-err"></p>
            </div>
            <div class="form-group">
                <label for="signin-password">Password</label>
                <input id="signin-password" name="password" type="password" autocomplete="current-password" placeholder="password123" required>
                <p class="error-msg" id="signin-password-err"></p>
            </div>
            <button type="submit">Sign in</button>
            <p class="hint">Demo sign in: admin@gmail.com / password123</p>
        </form>

        <form id="signup-form" class="hidden" novalidate>
            <div class="form-group">
                <label for="signup-name">Full name</label>
                <input id="signup-name" type="text" autocomplete="name" placeholder="Ada Lovelace" required>
                <p class="error-msg" id="signup-name-err"></p>
            </div>
            <div class="form-group">
                <label for="signup-email">Gmail address</label>
                <input id="signup-email" type="email" autocomplete="email" placeholder="you@gmail.com" required>
                <p class="error-msg" id="signup-email-err"></p>
            </div>
            <div class="form-group">
                <label for="signup-phone">Phone number</label>
                <input id="signup-phone" type="tel" autocomplete="tel" placeholder="+1 555 123 4567" required>
                <p class="error-msg" id="signup-phone-err"></p>
            </div>
            <div class="form-group">
                <label for="signup-pass">Password</label>
                <input id="signup-pass" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
                <p class="error-msg" id="signup-pass-err"></p>
            </div>
            <div class="form-group">
                <label for="signup-confirm">Re-enter password</label>
                <input id="signup-confirm" type="password" autocomplete="new-password" placeholder="Repeat your password" required>
                <p class="error-msg" id="signup-confirm-err"></p>
            </div>
            <button type="submit">Create account</button>
        </form>
        <p class="privacy-note">&copy;Verification page. All rights reserved.</p>
    </main>
    <script src="verification.js"></script>
</body>
</html>
